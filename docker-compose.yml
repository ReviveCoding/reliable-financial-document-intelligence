services:
  api:
    build: .
    command: uvicorn services.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://rfdi:rfdi@postgres/rfdi
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: minio:9000
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]
  worker:
    build: .
    command: python -m rfdi.cli resume
    depends_on: [redis, postgres]
  postgres:
    image: postgres:18
    environment: {POSTGRES_USER: rfdi, POSTGRES_PASSWORD: rfdi, POSTGRES_DB: rfdi}
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: rfdi-local, MINIO_ROOT_PASSWORD: rfdi-local-development-only}
    volumes: [minio-data:/data]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.0
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
volumes: {postgres-data: {}, minio-data: {}}
