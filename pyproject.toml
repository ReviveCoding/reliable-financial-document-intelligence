[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfdi"
version = "0.1.0"
description = "Reliable Financial Document Intelligence research simulation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8"]
ml = ["numpy>=2", "scikit-learn>=1.5", "matplotlib>=3.9", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rfdi = "rfdi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
