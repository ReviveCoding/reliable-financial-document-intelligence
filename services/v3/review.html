<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R-FDI V3 Review</title>
<style>body{font:15px system-ui;margin:2rem;background:#f5f7fa;color:#172033}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.card{background:white;padding:1rem;border-radius:8px;box-shadow:0 1px 5px #ccd}img{max-width:100%}input,textarea,button{margin:.3rem;padding:.5rem}pre{white-space:pre-wrap}.bbox{border:2px solid #e33}</style></head>
<body><h1>R-FDI Reviewer</h1><p>Predictions and corrections remain separate, versioned records.</p><label>Document ID <input id="doc"></label><button onclick="loadDoc()">Load</button>
<div class="grid"><section class="card"><h2>Document/provenance</h2><pre id="meta"></pre><div id="image"></div></section><section class="card"><h2>Prediction</h2><pre id="result"></pre><label>Corrections JSON<textarea id="corrections">{}</textarea></label><br><label>Reason <input id="reason" value="manual verification"></label><br><button onclick="review('ACCEPT')">ACCEPT</button><button onclick="review('EDIT')">EDIT</button><button onclick="review('REJECT')">REJECT</button><button onclick="review('ESCALATE')">ESCALATE</button><pre id="message"></pre></section></div>
<script>const api=location.port==='8080'?'http://localhost:8000':'';async function loadDoc(){let id=doc.value;meta.textContent=JSON.stringify(await(await fetch(api+'/documents/'+id)).json(),null,2);result.textContent=JSON.stringify(await(await fetch(api+'/documents/'+id+'/result')).json(),null,2)}async function review(action){let r=await fetch(api+'/documents/'+doc.value+'/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,corrections:JSON.parse(corrections.value),reason:reason.value,reviewer:'manual-ui'})});message.textContent=await r.text()}</script></body></html>
