<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="E2 row matchability vs field accuracy">
<style>text{font-family:Inter,Arial,sans-serif;fill:#334155}.title{font-size:24px;font-weight:700;fill:#0f172a}.sub{font-size:13px;fill:#64748b}.label{font-size:12px}.value{font-size:12px;font-weight:600}@media(prefers-color-scheme:dark){text{fill:#cbd5e1}.title{fill:#f8fafc}.sub{fill:#94a3b8}}</style>
<rect width="900" height="500" rx="16" fill="#ffffff"/><text x="48" y="44" class="title">E2 row matchability vs field accuracy</text><text x="48" y="68" class="sub">These metrics answer different questions and are not interchangeable</text><line x1="270" y1="90" x2="270" y2="450" stroke="#94a3b8"/><text x="260" y="117" text-anchor="end" class="label">matched-row F1</text><rect x="270" y="100" width="524.36" height="24" rx="4" fill="#2563eb"/><text x="804.36" y="117" class="value">0.9534</text><text x="260" y="171" text-anchor="end" class="label">matched-field micro F1</text><rect x="270" y="154" width="472.18" height="24" rx="4" fill="#0f766e"/><text x="752.18" y="171" class="value">0.8585</text><text x="260" y="225" text-anchor="end" class="label">row exact rate</text><rect x="270" y="208" width="331.24" height="24" rx="4" fill="#d97706"/><text x="611.24" y="225" class="value">0.6023</text></svg>
