name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests docs/generate_visualizations.py docs/generate_v3_1_visualizations.py docs/generate_v3_2_visualizations.py

      - name: Run deterministic unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Verify V1 evidence
        run: python scripts/verify_evidence.py

      - name: Verify V2 evidence
        run: python scripts/verify_v2_committed_evidence.py

      - name: Verify V3 evidence and immutable V2 lineage
        run: python scripts/v3/verify_evidence.py

      - name: Verify V3.1 evidence and frozen scientific lineage
        run: python scripts/v3_1/verify_evidence.py

      - name: Verify V3.2 evidence, protocol, leakage controls, and frozen lineage
        run: python scripts/v3_2/verify_evidence.py

      - name: Regenerate publication visualizations
        run: |
          python docs/generate_visualizations.py
          python docs/generate_v3_1_visualizations.py
          python docs/generate_v3_2_visualizations.py
          git diff --exit-code -- docs/assets artifacts/v3_1/statistics/summary.json

      - name: Check whitespace
        run: git diff --check HEAD^
